<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Ban Call</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%23B0382D%27 stroke-width=%274%27/%3E%3Cpath d=%27M7.5 24.5L24.5 7.5%27 stroke=%27%23B0382D%27 stroke-width=%274%27/%3E%3C/svg%3E">
<style>
  :root { --paper:#fff; --ink:#15171c; --faint:#5e636c; --hair:#d9dce1; --blue:#2a4bad; }
  @media (prefers-color-scheme: dark) { :root { --paper:#121418; --ink:#e8e6e1; --faint:#9a9ea7; --hair:#3a3e46; --blue:#8aa3ec; } }
  body { background:var(--paper); color:var(--ink); font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif; font-size:14px; margin:0; }
  main { max-width:520px; margin:18vh auto; padding:0 24px; }
  h1 { font-size:26px; font-weight:800; letter-spacing:-.02em; margin:0 0 6px 0; }
  p { color:var(--faint); margin:6px 0; }
  input { font:inherit; height:28px; width:260px; padding:0 6px; background:var(--paper); color:var(--ink); border:1px solid var(--hair); border-radius:0; }
  button { font:inherit; height:28px; padding:0 12px; background:var(--paper); color:var(--ink); border:1px solid var(--ink); border-radius:0; cursor:pointer; }
  #msg { min-height:1.4em; }
</style>
<main>
  <h1>Ban Call</h1>
  <p>This page needs a key. Open it with the link you were given, or enter the key here.</p>
  <p><input id="k" type="password" placeholder="key" autocomplete="off"> <button id="go">Open</button></p>
  <p id="msg"></p>
</main>
<script>
(() => {
const SALT = "TEC7QZyo+QAf6zyC+1Lc7Q==", ITER = 200000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass) {
  const msg = document.getElementById('msg'); msg.textContent = 'opening';
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = new Uint8Array(await (await fetch('explorer.enc', { cache: 'no-store' })).arrayBuffer());
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) { msg.textContent = 'That key does not open this page.'; }
}
document.getElementById('go').onclick = () => unlock(document.getElementById('k').value);
document.getElementById('k').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(e.target.value); });
const fromHash = () => { if (location.hash.length > 1) unlock(decodeURIComponent(location.hash.slice(1))); };
window.addEventListener('hashchange', fromHash); fromHash();
})();
</script>
</html>
