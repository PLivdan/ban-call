<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ban Call layout options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,600;1,400&display=swap">
<style id="base"></style>
<style>
  .opt { border-top: 3px solid var(--ink); margin: 26px 0 8px 0; padding-top: 4px; }
  .opt > .tag { font-size: 15px; font-weight: 600; }
  .opt > .note { font-size: 12px; color: var(--faint); max-width: 760px; margin: 2px 0 8px 0; }
  .ex { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-start; }
  .ex > div { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .card { width: 150px; border: 1px solid var(--hair); padding: 6px; }
  .card img { width: 64px; height: 64px; display: block; border: 1px solid var(--hair); }
  .card .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .card .why { font-size: 11.5px; color: var(--faint); line-height: 1.25; }
  .strip { display: flex; flex-wrap: wrap; gap: 4px; max-width: 620px; }
  .strip .t { width: 56px; text-align: center; font-size: 10.5px; line-height: 1.1; }
  .strip img { width: 46px; height: 46px; display: block; margin: 0 auto 1px auto; border: 1px solid var(--hair); }
  .strip .p { font-weight: 600; font-size: 12px; }
</style>
<main>
<h1>Ban Call: layout options <span class="small">&nbsp;the same lobby drawn different ways (Grandmaster 3, Hellfire Gala (Domination), you on Deadpool (Vanguard), a teammate hovering Emma Frost, first ban)</span></h1>
<div id="out" class="small">Loading the model&hellip;</div>
</main>
<script src="engine.js"></script>
<script src="examples.js"></script>
</html>
